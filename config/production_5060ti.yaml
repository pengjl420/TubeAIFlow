hardware:
  target_gpu: "RTX 5060 Ti 16GB"
  system_ram_gb: 32
  max_gpu_jobs: 1
  parallel_large_models: false
  min_free_ram_gb: 5
  min_free_vram_gb: 1

video:
  width: 1920
  height: 1080
  fps: 30
  subtitle_safe_zone: 0.18

semantic:
  provider: llamacpp
  model: qwen3-8b-q4_k_m
  model_path: models/llm/qwen3-8b-q4_k_m/Qwen3-8B-Q4_K_M.gguf
  base_url: http://127.0.0.1:18090
  timeout_seconds: 180
  context_tokens: 16384
  thinking: false
  temperature: 0.3
  chunk_minutes: [2, 4]
  local_context_before_sec: 15
  local_context_after_sec: 15

embedding:
  model: BAAI/bge-m3
  model_path: models/embedding/bge-m3-onnx
  device: cpu
  max_length: 512

segmentation:
  target_scene_sec: [8, 18]
  min_scene_sec: 5
  max_scene_sec: 30

visual_generation:
  mode: curated

anime:
  target_master_scene_sec: [8, 15]
  min_master_scene_sec: 5
  max_master_scene_sec: 15
  derived_shot_change_sec: [3, 6]
  candidates_per_scene: 1
  style_prompt: "Original non-photorealistic 2D animated documentary illustration, clean expressive line art, controlled cel shading, consistent character proportions and facial design, cohesive navy teal and warm amber color palette, soft cinematic lighting, detailed but uncluttered background, professional widescreen composition. Preserve the same art direction across every scene."
  negative_prompt: "photorealistic, 3D render, live action, inconsistent character design, random costume changes, watermark, logo, random text, copyrighted character, imitation of a named living artist"

selection:
  candidate_threshold: 0.62
  target_visuals_per_minute: 1.8
  soft_max_visuals_per_minute: 3
  hard_max_visuals_per_minute: 4
  min_generated_visual_gap_sec: 10
  max_same_visual_type_in_row: 2
  max_same_layout_in_row: 2
  duplicate_embedding_threshold: 0.92

render:
  preview_codec: h264_nvenc
  final_codec: libx264
  final_crf: 18
  final_preset: medium
  audio_codec: aac
  audio_bitrate: 192k
  pixel_format: yuv420p
  fade_sec: 0.3
  zoom_min: 1.02
  zoom_max: 1.06

cache:
  enabled: true
  hash_algorithm: sha256

runtime:
  resume: true
  keep_raw_llm_output_on_error: true
  save_all_generations: true
